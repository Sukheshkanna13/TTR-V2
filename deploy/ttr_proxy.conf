# /etc/nginx/ttr_proxy.conf — shared proxy settings.
# X-Forwarded-For is OVERWRITTEN (not appended) so clients cannot spoof their IP;
# core.middleware.ProxyRemoteAddrMiddleware relies on this.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
proxy_read_timeout 60s;
proxy_pass http://ttr_app;
