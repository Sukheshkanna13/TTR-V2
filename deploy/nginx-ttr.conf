# /etc/nginx/sites-available/ttr  (symlink into sites-enabled)
# Replace example.com. Get certificates first: sudo certbot --nginx -d example.com -d www.example.com
# then re-check that the ssl_certificate lines below match what certbot wrote.

# Brute-force / OTP-spam brake on the auth endpoints (per client IP)
limit_req_zone $binary_remote_addr zone=ttr_auth:10m rate=10r/m;

upstream ttr_app {
    server unix:/run/ttr/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 20m;   # room / banner image uploads
    add_header X-Content-Type-Options nosniff always;

    location /static/ {
        alias /srv/ttr/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Uploaded room images, banners, attractions. Never executes anything.
    location /media/ {
        alias /srv/ttr/app/media/;
        expires 7d;
        access_log off;
    }

    # Auth endpoints: rate limited
    location ~ ^/accounts/(login|register|verify-otp|resend-otp|set-password|forgot-password)/ {
        limit_req zone=ttr_auth burst=10 nodelay;
        include /etc/nginx/ttr_proxy.conf;
    }

    # Optional: restrict the Django admin to your office/VPN IP
    # location /admin/ {
    #     allow 203.0.113.10;
    #     deny all;
    #     include /etc/nginx/ttr_proxy.conf;
    # }

    location / {
        include /etc/nginx/ttr_proxy.conf;
    }
}
