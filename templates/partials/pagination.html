{% load pagination_tags %}
{% if page_obj.has_other_pages %}
<div class="pagination" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; font-size: 14px;">
    {% if page_obj.has_previous %}
        <a href="{% page_url request 1 %}" style="padding: 5px 10px; border: 1px solid var(--c-border); border-radius: 4px; text-decoration: none; color: var(--c-text-main);">« First</a>
        <a href="{% page_url request page_obj.previous_page_number %}" style="padding: 5px 10px; border: 1px solid var(--c-border); border-radius: 4px; text-decoration: none; color: var(--c-text-main);">‹ Prev</a>
    {% else %}
        <span style="padding: 5px 10px; border: 1px solid var(--c-border); border-radius: 4px; color: #aaa; cursor: not-allowed;">« First</span>
        <span style="padding: 5px 10px; border: 1px solid var(--c-border); border-radius: 4px; color: #aaa; cursor: not-allowed;">‹ Prev</span>
    {% endif %}

    <span style="padding: 5px 10px; color: var(--c-text-main);">
        Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
        <a href="{% page_url request page_obj.next_page_number %}" style="padding: 5px 10px; border: 1px solid var(--c-border); border-radius: 4px; text-decoration: none; color: var(--c-text-main);">Next ›</a>
        <a href="{% page_url request page_obj.paginator.num_pages %}" style="padding: 5px 10px; border: 1px solid var(--c-border); border-radius: 4px; text-decoration: none; color: var(--c-text-main);">Last »</a>
    {% else %}
        <span style="padding: 5px 10px; border: 1px solid var(--c-border); border-radius: 4px; color: #aaa; cursor: not-allowed;">Next ›</span>
        <span style="padding: 5px 10px; border: 1px solid var(--c-border); border-radius: 4px; color: #aaa; cursor: not-allowed;">Last »</span>
    {% endif %}
</div>
{% endif %}
